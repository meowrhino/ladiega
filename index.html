<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>la diega — música, diseño sonoro y sfx</title>
    <meta name="description" content="la diega: composición, diseño sonoro y sfx para marcas y audiovisual. Nike, Loewe, Massimo Dutti, Timberland, Adolfo Domínguez, Pull&amp;Bear, Oysho, Pacsun, Samantha Hudson.">

    <!-- canonical: la copia y el repo de verdad llevan este mismo archivo, y
         los dos apuntan aqui. Asi Google sabe cual es el sitio bueno -->
    <link rel="canonical" href="https://ladiega.com/">

    <meta property="og:title" content="la diega — música, diseño sonoro y sfx">
    <meta property="og:description" content="Composición, diseño sonoro y sfx para marcas y audiovisual.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ladiega.com/">
    <meta property="og:image" content="https://ladiega.com/data/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="la diega">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/png" href="data/navicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="about.css">
    <!-- iconos que solo aparecen al hacer hover: precargados para que no parpadeen -->
    <link rel="preload" as="image" href="data/icons/arrow-left-hi.svg">
    <link rel="preload" as="image" href="data/icons/arrow-right-hi.svg">
    <link rel="preload" as="image" href="data/icons/hand-point.svg">
</head>
<body>
    <!-- Los proyectos se pintan desde data.json con JavaScript, asi que en el
         codigo de la pagina no hay texto que leer. Esto se lo da a quien no
         ejecute JS (algunos buscadores y las vistas previas de los enlaces) -->
    <noscript>
        <h1>la diega</h1>
        <p>Composición, diseño sonoro y sfx para marcas y audiovisual.</p>
        <ul>
            <li>Menudas Piezas OST</li>
            <li>Samantha Hudson</li>
            <li>Amor Butano</li>
            <li>Pull&amp;Bear</li>
            <li>Massimo Dutti</li>
            <li>Nike</li>
            <li>Adolfo Domínguez</li>
            <li>Pacsun</li>
            <li>Timberland</li>
            <li>Loewe</li>
            <li>Oysho</li>
        </ul>
        <p>Contacto: <a href="mailto:diego.fd.92@gmail.com">diego.fd.92@gmail.com</a></p>
    </noscript>

    <!-- Carrusel: dos slides que se alternan para el desplazamiento -->
    <div id="stage" class="stage">
        <div class="slide" data-slide="a">
            <video class="bg-video" muted playsinline preload="none"></video>
            <video class="main-video" muted playsinline preload="auto"></video>
        </div>
        <div class="slide offright" data-slide="b">
            <video class="bg-video" muted playsinline preload="none"></video>
            <video class="main-video" muted playsinline preload="auto"></video>
        </div>
    </div>

    <!-- La telita -->
    <div class="veil"></div>

    <!-- Esquinas: las tres abren el menu -->
    <button id="menuBtn" class="ui" aria-label="abrir menú">menú</button>
    <button id="brandBtn" class="ui" aria-label="abrir menú">la diega</button>
    <div id="ficha" class="ui ficha" role="button" tabindex="0" aria-label="abrir menú"></div>

    <!-- Titulo gigante al cambiar de video -->
    <div id="bigTitle" class="big-title hidden" aria-hidden="true"></div>

    <!-- Barrido diagonal al navegar desde el menu -->
    <div id="wipe" class="wipe" aria-hidden="true"></div>

    <!-- Navegacion del video: elementos sueltos repartidos por la pantalla -->
    <div id="controls" class="controls faded">
        <button id="playBtn" class="ctrl play-big">pause</button>
        <input id="seekBar" class="ctrl" type="range" min="0" max="1000" value="0" aria-label="progreso">
        <button id="autoBtn" class="ctrl toggle on" aria-label="avance automático">auto</button>
        <button id="soundBtn" class="ctrl toggle on" aria-label="sonido">sound</button>
        <button id="arrowPrev" class="ctrl edge-arrow left" aria-label="video anterior"></button>
        <button id="arrowNext" class="ctrl edge-arrow right" aria-label="video siguiente"></button>
    </div>

    <!-- Menu: pantalla completa sobre el video difuminado -->
    <div id="menuOverlay" class="overlay menu-overlay hidden">
        <button id="menuClose" class="overlay-close" aria-label="cerrar">×</button>
        <nav id="menuNav" class="menu-nav" aria-label="menú principal"></nav>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
